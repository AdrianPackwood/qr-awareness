<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Got Rick Rolled!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #1a2e1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .poster-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        .poster-wrapper img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            display: block;
        }
        /* Video overlay positioned over the GIF area in the poster */
        .video-overlay {
            position: absolute;
            top: 31%;
            left: 40%;
            width: 19%;
            height: 28%;
            overflow: visible;
            border-radius: 4px;
            /* DEV: red border so you can see the box */
            border: 2px dashed red;
            resize: both;
        }
        .video-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="poster-wrapper">
        <img src="rickroll.png" alt="Stop Think Verify - QR Code Security Awareness">
        <div class="video-overlay" id="videoOverlay">
            <iframe 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&loop=1&playlist=dQw4w9WgXcQ" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- DEV MODE: drag the video box, values shown in yellow box -->
    <div id="coords" style="position:fixed;top:10px;left:10px;background:yellow;padding:10px;font-family:monospace;font-size:14px;z-index:9999;border:2px solid black;"></div>
    <script>
        const el = document.getElementById('videoOverlay');
        const img = document.querySelector('.poster-wrapper img');
        const coordsEl = document.getElementById('coords');
        let dragging = false, startX, startY, origLeft, origTop;

        function updateCoords() {
            const imgRect = img.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            const top = ((elRect.top - imgRect.top) / imgRect.height * 100).toFixed(1);
            const left = ((elRect.left - imgRect.left) / imgRect.width * 100).toFixed(1);
            const width = (elRect.width / imgRect.width * 100).toFixed(1);
            const height = (elRect.height / imgRect.height * 100).toFixed(1);
            coordsEl.textContent = 'top: ' + top + '% | left: ' + left + '% | width: ' + width + '% | height: ' + height + '%';
        }

        el.addEventListener('mousedown', function(e) {
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            origLeft = el.offsetLeft;
            origTop = el.offsetTop;
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (dragging) {
                el.style.left = (origLeft + e.clientX - startX) + 'px';
                el.style.top = (origTop + e.clientY - startY) + 'px';
                updateCoords();
            }
        });

        document.addEventListener('mouseup', function() {
            dragging = false;
        });

        new ResizeObserver(updateCoords).observe(el);
        setTimeout(updateCoords, 500);
    </script>
</body>
</html>
