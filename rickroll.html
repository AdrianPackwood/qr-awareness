<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Got Rick Rolled!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #1a2e1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .poster-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        .poster-wrapper img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            display: block;
        }
        .video-overlay {
            position: absolute;
            top: 31%;
            left: 40%;
            width: 19%;
            height: 28%;
            border: 2px dashed red;
            border-radius: 4px;
        }
        .video-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }
        /* Resize handle - bottom right corner */
        .resize-handle {
            position: absolute;
            bottom: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: red;
            cursor: nwse-resize;
            z-index: 100;
            border: 2px solid white;
        }
        #coords {
            position: fixed;
            top: 10px;
            left: 10px;
            background: yellow;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            z-index: 9999;
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <div class="poster-wrapper" id="posterWrapper">
        <img src="rickroll.png" alt="Stop Think Verify - QR Code Security Awareness">
        <div class="video-overlay" id="videoOverlay">
            <iframe 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&loop=1&playlist=dQw4w9WgXcQ" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>
            <div class="resize-handle" id="resizeHandle"></div>
        </div>
    </div>

    <div id="coords">Loading...</div>

    <script>
        var el = document.getElementById('videoOverlay');
        var handle = document.getElementById('resizeHandle');
        var img = document.querySelector('.poster-wrapper img');
        var coordsEl = document.getElementById('coords');

        var dragging = false;
        var resizing = false;
        var startX, startY, origLeft, origTop, origW, origH;

        function updateCoords() {
            var imgRect = img.getBoundingClientRect();
            var elRect = el.getBoundingClientRect();
            var top = ((elRect.top - imgRect.top) / imgRect.height * 100).toFixed(1);
            var left = ((elRect.left - imgRect.left) / imgRect.width * 100).toFixed(1);
            var width = (elRect.width / imgRect.width * 100).toFixed(1);
            var height = (elRect.height / imgRect.height * 100).toFixed(1);
            coordsEl.textContent = 'top: ' + top + '% | left: ' + left + '% | width: ' + width + '% | height: ' + height + '%';
        }

        // DRAG: click anywhere on the box to move it
        el.addEventListener('mousedown', function(e) {
            if (e.target === handle) return; // don't drag when resizing
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            origLeft = el.offsetLeft;
            origTop = el.offsetTop;
            e.preventDefault();
        });

        // RESIZE: click the red square in the corner
        handle.addEventListener('mousedown', function(e) {
            resizing = true;
            startX = e.clientX;
            startY = e.clientY;
            origW = el.offsetWidth;
            origH = el.offsetHeight;
            e.preventDefault();
            e.stopPropagation();
        });

        document.addEventListener('mousemove', function(e) {
            if (dragging) {
                el.style.left = (origLeft + e.clientX - startX) + 'px';
                el.style.top = (origTop + e.clientY - startY) + 'px';
                updateCoords();
            }
            if (resizing) {
                el.style.width = (origW + e.clientX - startX) + 'px';
                el.style.height = (origH + e.clientY - startY) + 'px';
                updateCoords();
            }
        });

        document.addEventListener('mouseup', function() {
            dragging = false;
            resizing = false;
        });

        setTimeout(updateCoords, 500);
    </script>
</body>
</html>
